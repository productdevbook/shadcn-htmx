<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="640" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="1280" height="640" fill="#09090b"/>
    <rect width="1280" height="640" fill="url(#dots)"/>
    <circle cx="1060" cy="120" r="360" fill="url(#glow)"/>
    <circle cx="1180" cy="560" r="300" fill="url(#glow2)"/>
    <!-- top accent hairline -->
    <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

    <!-- Brand row -->
    <g transform="translate(96, 92)">
      <rect width="52" height="52" rx="13" fill="#fafafa"/>
      <text x="26" y="35" text-anchor="middle" font-size="22" font-weight="800" fill="#09090b">sh</text>
      <text x="68" y="34" font-size="26" font-weight="700" fill="#fafafa" letter-spacing="-0.5">shadcn-htmx</text>
    </g>

    <!-- Title -->
    <g transform="translate(96, 250)">
      <text x="0" y="0" font-size="74" font-weight="800" fill="#fafafa" letter-spacing="-2">shadcn-style components,</text>
      <text x="0" y="86" font-size="74" font-weight="800" fill="url(#accent)" letter-spacing="-2">for the server.</text>
    </g>

    <!-- Subtitle -->
    <text x="96" y="430" font-size="25" font-weight="450" fill="#a1a1aa" letter-spacing="-0.2">82 web-standards components for htmx v4 + Tailwind v4 — five flavours.</text>

    <!-- Flavour pills -->
    <g transform="translate(96, 480)" font-size="15" font-weight="600" fill="#d4d4d8">
      <g><rect width="104" height="34" rx="17" fill="#18181b" stroke="#27272a"/><text x="52" y="22" text-anchor="middle">Hono JSX</text></g>
      <g transform="translate(116,0)"><rect width="86" height="34" rx="17" fill="#18181b" stroke="#27272a"/><text x="43" y="22" text-anchor="middle">Jinja2</text></g>
      <g transform="translate(214,0)"><rect width="64" height="34" rx="17" fill="#18181b" stroke="#27272a"/><text x="32" y="22" text-anchor="middle">Go</text></g>
      <g transform="translate(290,0)"><rect width="96" height="34" rx="17" fill="#18181b" stroke="#27272a"/><text x="48" y="22" text-anchor="middle">Phoenix</text></g>
      <g transform="translate(398,0)"><rect width="74" height="34" rx="17" fill="#18181b" stroke="#27272a"/><text x="37" y="22" text-anchor="middle">HTML</text></g>
      <g transform="translate(484,0)"><rect width="106" height="34" rx="17" fill="none" stroke="#3f3f46" stroke-dasharray="4 5"/><text x="53" y="22" text-anchor="middle" fill="#71717a">and more</text></g>
    </g>

    <!-- Stat line -->
    <g transform="translate(96, 560)" font-size="14" font-weight="500" fill="#71717a">
      <text x="0" y="14">WAI-ARIA accessible</text>
      <text x="172" y="14" fill="#3f3f46">·</text>
      <text x="190" y="14">native HTML &amp; Web APIs</text>
      <text x="372" y="14" fill="#3f3f46">·</text>
      <text x="390" y="14">flavour-aware CLI</text>
    </g>

    <!-- Floating component glyph cards (right) -->
    <g opacity="0.92" stroke-linecap="round" stroke-linejoin="round">
      <!-- button -->
      <g transform="translate(1035, 92) rotate(-6)">
        <rect width="190" height="92" rx="16" fill="#101012" stroke="#27272a" stroke-width="1.5"/>
        <g class="text-primary" transform="translate(45,34)">
          <rect width="100" height="26" rx="6" stroke="#38bdf8" stroke-width="2" fill="none"/>
          <line x1="32" y1="13" x2="68" y2="13" stroke="#38bdf8" stroke-width="2"/>
        </g>
      </g>
      <!-- switch -->
      <g transform="translate(1048, 248) rotate(6)">
        <rect width="190" height="92" rx="16" fill="#101012" stroke="#27272a" stroke-width="1.5"/>
        <g transform="translate(58,34)">
          <rect width="74" height="26" rx="13" stroke="#a1a1aa" stroke-width="2" fill="none"/>
          <circle cx="58" cy="13" r="8" fill="#34d399"/>
        </g>
      </g>
      <!-- slider -->
      <g transform="translate(1030, 404) rotate(-4)">
        <rect width="190" height="92" rx="16" fill="#101012" stroke="#27272a" stroke-width="1.5"/>
        <g transform="translate(30,46)">
          <line x1="0" y1="0" x2="130" y2="0" stroke="#3f3f46" stroke-width="3"/>
          <line x1="0" y1="0" x2="78" y2="0" stroke="#818cf8" stroke-width="3"/>
          <circle cx="78" cy="0" r="9" fill="#818cf8"/>
        </g>
      </g>
    </g>
  </g>
</svg>
