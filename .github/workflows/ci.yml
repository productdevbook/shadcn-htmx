name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck · build · CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:cli

  e2e:
    name: Playwright e2e (a11y · keyboard · geometry · smoke · console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run e2e
        run: |
          PORT=3010 bun run app/server.tsx > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3010/ >/dev/null && break
            sleep 1
          done
          bun run test:e2e
